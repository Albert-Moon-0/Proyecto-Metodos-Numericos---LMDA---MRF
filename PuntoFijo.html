<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Método del Punto Fijo — Métodos Numéricos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="bg-grid" aria-hidden="true"></div>

    <div class="page">
        <a class="back-link" href="index.html">
            <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 3 L5 8 L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Volver al proyecto
        </a>

        <header class="page-header">
            <p class="page-header__kicker">Método iterativo</p>
            <h1>Método del Punto Fijo</h1>
            <p class="page-header__intro">
                Conversión entre representación decimal y una representación binaria
                de punto fijo con signo, característica y mantisa configurables.
            </p>
        </header>

        <section class="panel" aria-labelledby="config-title">
            <h2 id="config-title">Configuración del formato</h2>
            <div class="field-row">
                <div class="field">
                    <label for="total-bits">Bits totales</label>
                    <input type="text" id="total-bits" placeholder="Ejemplo: 32">
                </div>
                <div class="field">
                    <label for="characteristic-bits">Bits de característica</label>
                    <input type="text" id="characteristic-bits" placeholder="Ejemplo: 8">
                </div>
                <div class="field">
                    <label for="mantissa-bits">Bits de mantisa</label>
                    <input type="text" id="mantissa-bits" placeholder="Ejemplo: 23">
                </div>
            </div>
        </section>

        <div class="tool-grid">
            <section class="panel" aria-labelledby="bin-dec-title">
                <h2 id="bin-dec-title">Binario → Decimal</h2>
                <div class="field">
                    <label for="binary-input">Representación binaria</label>
                    <input type="text" id="binary-input" placeholder="Ejemplo: 101101.011 o 01000000101110100000000000000000">
                </div>
                <button class="btn" id="binary-to-decimal" type="button">Convertir a decimal</button>
            </section>

            <section class="panel" aria-labelledby="dec-bin-title">
                <h2 id="dec-bin-title">Decimal → Binario</h2>
                <div class="field">
                    <label for="decimal-input">Representación decimal</label>
                    <input type="text" id="decimal-input" placeholder="Ejemplo: 13.625">
                </div>
                <button class="btn" id="decimal-to-binary" type="button">Convertir a binario</button>
            </section>
        </div>

        <section class="result-panel" aria-live="polite">
            <h2>Resultado</h2>
            <p id="result"></p>
            <p id="error-message" class="error-text"></p>
        </section>
    </div>

    <script src="PuntoFijo.js"></script>
</body>
</html>
